spring.application.name=coche

# Puerto 8081: el 8080 lo usa MAMP (Apache/phpMyAdmin), no lo toques
server.port=8081

# Conexion a MySQL: la lee com.example.coche.conexion.ConexionBD (Singleton JDBC), no Spring.
# La contraseña tambien se puede poner con la variable de entorno DB_PASSWORD (tiene prioridad).
db.url=jdbc:mysql://localhost:3306/coche_db?useSSL=false&serverTimezone=UTC
db.usuario=root
db.password=root
