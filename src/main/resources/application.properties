spring.application.name=coche

# Puerto 8081: el 8080 lo usa MAMP (Apache/phpMyAdmin), no lo toques
server.port=8081

# Conexion a MySQL: estos valores no los usa Spring, los lee com.example.coche.conexion.ConexionBD (Singleton JDBC)
# XAMPP: root sin contrasena (db.password vacio). MAMP: db.password=root
db.url=jdbc:mysql://localhost:3306/coche_db?useSSL=false&serverTimezone=UTC
db.usuario=root
db.password=
